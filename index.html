<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>Clínica Dental Sonrisa</title>
    <meta name="description" content="Clínica dental en Monterrey: limpieza, ortodoncia, blanqueamiento y más.">
    <link rel="canonical" href="https://clinica-dental-vue.netlify.app/">

    <!-- Open Graph: vista previa al compartir el enlace (las redes no ejecutan JavaScript). -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_MX">
    <meta property="og:site_name" content="Clínica Dental Sonrisa">
    <meta property="og:title" content="Clínica Dental Sonrisa">
    <meta property="og:description" content="Clínica dental en Monterrey: limpieza, ortodoncia, blanqueamiento y más.">
    <meta property="og:url" content="https://clinica-dental-vue.netlify.app/">
    <meta property="og:image" content="https://clinica-dental-vue.netlify.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Página de inicio de Clínica Dental Sonrisa">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <div id="app"></div>

    <!--
      Formularios ocultos para que Netlify los detecte al hacer el deploy.
      Los formularios visibles los genera Vue con JavaScript y Netlify no los ve.
      Deben tener los mismos nombres de campo que se envían desde src/utils/netlifyForms.ts.
    -->
    <form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field">
      <input name="name">
      <input name="email">
      <input name="phone">
      <input name="service">
      <input name="doctor">
      <input name="date">
      <input name="time">
      <textarea name="notes"></textarea>
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field">
      <input name="name">
      <input name="email">
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
